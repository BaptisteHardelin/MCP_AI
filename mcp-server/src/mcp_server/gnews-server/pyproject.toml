[project]
name = "gnews-server"
version = "0.1.0"
description = "MCP server for the GNews API"
readme = "README.md"
authors = [
    { name = "BaptisteHardelin", email = "baptiste.hardelin@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.2.0",
]

[project.scripts]
gnews-server = "gnews_server:main"

[build-system]
requires = ["uv_build>=0.12.22,<0.13.0"]
build-backend = "uv_build"
